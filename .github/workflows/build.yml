name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels an older run of the same pull request. Runs of main go one at a time, and a newer push takes the place
# of a run still waiting its turn, since the newer run checks those commits too; a release commit keeps its own run, because the release waits for it
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || (startsWith(github.event.head_commit.message, 'Version ') && github.sha || 'main') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  feature-form:
    name: Feature form
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Issue forms list every feature in docs/FEATURES.md
        run: ./scripts/feature-form.sh --check

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: No signing keys, certificates, profiles or tokens in the code
        run: ./scripts/check-secrets.sh

  # A pull request that changes only documents skips the macOS jobs: nothing they build or test reads those files.
  # CONTRIBUTING.md holds the test lines, and check-strings needs every README to exist, so a change to CONTRIBUTING.md or a deleted or renamed document runs everything
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Look for changes outside the documents
        id: diff
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
             git diff --quiet --no-renames HEAD^ HEAD -- . ':!docs' ':!.github/ISSUE_TEMPLATE' ':!.github/PULL_REQUEST_TEMPLATE.md' ':(exclude,glob)*.md' &&
             git diff --quiet HEAD^ HEAD -- CONTRIBUTING.md &&
             git diff --quiet --no-renames --diff-filter=D HEAD^ HEAD; then
            code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  direct:
    name: Direct
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # When the cache has no FFmpeg for this fetch-ffmpeg.sh, Direct and Tests each build it once and save it
      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}

      - name: Install the FFmpeg build tools
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: brew install meson ninja nasm pkg-config

      - name: Build
        run: |
          xcodebuild -version
          ./scripts/build.sh

      # The built app has to start, keep running and quit cleanly when asked
      - name: Start and quit the app
        run: swiftc -O scripts/smoke-test.swift -o build/smoke-test && build/smoke-test build/pikapik.app

      - name: Keep the crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: direct-crash-reports
          path: ~/Library/Logs/DiagnosticReports
          if-no-files-found: ignore
          retention-days: 7

  appstore:
    name: App Store
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: APPSTORE=1 ./scripts/build.sh

      - name: Start and quit the app
        run: swiftc -O scripts/smoke-test.swift -o build/smoke-test && build/smoke-test build/pikapik.app

      - name: Keep the crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-crash-reports
          path: ~/Library/Logs/DiagnosticReports
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    # the tests take about 35 minutes; the rest is room for tests stopped at their own time limit
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # the player tests read videos through the app's own FFmpeg build
      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja nasm pkg-config
          ./scripts/fetch-ffmpeg.sh

      # test-thumbnails makes its sample videos with Homebrew's ffmpeg; coreutils gives gtimeout, so one stuck test can't stop the rest
      - name: Install the ffmpeg and timeout tools
        if: ${{ !cancelled() }}
        run: brew install ffmpeg coreutils

      # test-archive opens its samples with the app's own 7-Zip
      - name: Fetch 7-Zip
        if: ${{ !cancelled() }}
        run: ./scripts/fetch-7zip.sh

      # test-fan-helper signs small programs with a certificate, as the app signs its helper; a throwaway one stands in for "pikapik Dev"
      - name: Make a throwaway signing certificate
        if: ${{ !cancelled() }}
        run: |
          cd "$RUNNER_TEMP"
          printf '[req]\ndistinguished_name = dn\nx509_extensions = ext\nprompt = no\n[dn]\nCN = pikapik CI\n[ext]\nbasicConstraints = critical, CA:false\nkeyUsage = critical, digitalSignature\nextendedKeyUsage = critical, codeSigning\n' > cert.cnf
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config cert.cnf -keyout key.pem -out cert.pem
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem -out ci.p12 -passout pass:ci
          keychain="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import ci.p12 -k "$keychain" -P ci -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -p codesigning "$keychain"
          echo "SIGN_IDENTITY=pikapik CI" >> "$GITHUB_ENV"

      # Every test runs even after one fails or a step above fails, so a single failure can't hide the others
      - name: Run the tests from CONTRIBUTING.md
        if: ${{ !cancelled() }}
        run: ./scripts/run-tests.sh
